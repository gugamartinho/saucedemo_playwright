name: SauceDemo UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  chrome:
    name: Chrome Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Chrome tests
        run: npx playwright test --project="chrome" --grep-invert "@mobile"
        env:
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }},
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }},
          LOCKED_USERNAME: ${{ secrets.LOCKED_USERNAME }},
          LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}

      - name: Upload Chrome report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-report
          path: playwright-report

  mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    needs: chrome
    if: always()   # <-- garante que corre mesmo se o Chrome falhar
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Mobile tests
        run: npx playwright test --project="android" --grep "@mobile"
        env:
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
          LOCKED_USERNAME: ${{ secrets.LOCKED_USERNAME }}
          LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}

      - name: Upload Mobile report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-report
          path: playwright-report
